<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essaki Trading Company – Billing</title>
<style>
:root{--bg:#fff8ec;--sf:#fff;--tx:#2b1a0a;--mu:#7a6650;--ac:#d9480f;--ac2:#f59f00;--bd:#ecd9b8;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1610;--sf:#271e15;--tx:#f5ead8;--mu:#b9a68a;--ac:#ff7a3d;--ac2:#f59f00;--bd:#43352500;--bd:#433525;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1610;--sf:#271e15;--tx:#f5ead8;--mu:#b9a68a;--ac:#ff7a3d;--ac2:#f59f00;--bd:#433525;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:12px 16px}
header h1{margin:0;font-size:20px}header small{opacity:.9}
.app{display:grid;gap:14px;padding:14px;max-width:1200px;margin:auto;grid-template-columns:1fr}
@media(min-width:900px){.app{grid-template-columns:1.5fr 1fr;align-items:start}.bill{position:sticky;top:10px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px}
.tools input{flex:1;min-width:140px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.cat{background:var(--ac2);color:#2b1a0a;font-weight:700;padding:6px 10px;border-radius:8px;margin:12px 0 4px}
.row{display:grid;grid-template-columns:30px 1fr 70px 62px 92px;gap:6px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--bd)}
.row.on{background:color-mix(in srgb,var(--ac2) 18%,transparent)}
.row .n{color:var(--mu);font-size:12px}.row .per{color:var(--mu);font-size:12px}
.row input.r{width:100%;padding:4px;text-align:right}
.row input.r.z{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--sf))}
.qty{display:flex;align-items:center;gap:2px}.qty button{padding:2px 8px}.qty input{width:38px;text-align:center;padding:4px 2px}
@media(max-width:560px){.row{grid-template-columns:24px 1fr 56px 86px}.row .per{display:none}}
.bill h2{margin:0 0 8px;font-size:17px}
.bl{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.bl span:first-child{flex:1}.tot{display:flex;justify-content:space-between;padding:3px 0}
.grand{font-size:20px;font-weight:700;color:var(--ac)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.f input{width:100%}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:10px}
.empty{color:var(--mu);text-align:center;padding:16px}
#rc{display:none}
@media print{
@page{size:80mm auto;margin:0}
body{background:#fff;color:#000}header,.app{display:none!important}
#rc{display:block;width:72mm;margin:0 auto;padding:3mm 0;font:12px/1.3 "Courier New",monospace;color:#000}
#rc .c{text-align:center}#rc .b{font-weight:700}#rc hr{border:0;border-top:1px dashed #000;margin:4px 0}
#rc .l{display:flex;justify-content:space-between;gap:6px}
}
</style></head><body>
<header><h1>🎆 ESSAKI TRADING COMPANY</h1><small>Price List 2026 · Billing</small></header>
<div class="app">
<section class="card">
<div class="tools"><input id="q" type="search" placeholder="Search item (e.g. sparkler, bomb)…"><select id="cf"></select></div>
<div id="list"></div>
</section>
<aside class="card bill">
<h2>Bill</h2>
<div class="f"><input id="cn" placeholder="Customer name"><input id="cp" placeholder="Phone" inputmode="tel"></div>
<div id="bl"></div>
<div class="tot"><span>Subtotal</span><b id="st">₹0</b></div>
<div class="tot"><span>Discount % <input id="dp" type="number" min="0" max="100" value="0" style="width:64px;padding:3px"></span><b id="da">-₹0</b></div>
<div class="tot grand"><span>Total</span><span id="gt">₹0</span></div>
<div class="acts"><button id="clr">Clear</button><button class="p" id="pr">🖨 Print Bill</button></div>
<p class="empty" style="font-size:12px;margin:8px 0 0">Tip: choose your POS/thermal printer (80mm) in the print dialog. Set margins to “None”.</p>
</aside>
</div>
<div id="rc"></div>
<script>
// [name, per, rate]  rate 0 = not on price list, enter manually
const D=[["SPARKLERS",[["7CM Electric Sparklers","10 Box",150],["7CM Colour Sparklers","10 Box",210],["10CM Electric Sparklers","5 Box",225],["10CM Colour Sparklers","5 Box",250],["10CM Jewel Box (5 in 1)","5 Box",280],["12CM Electric Sparklers","5 Box",280],["12CM Colour Sparklers","5 Box",315],["15CM Electric Sparklers","2 Box",240],["15CM Colour Sparklers","2 Box",270],["15CM Red & Green Sparklers","2 Box",315],["15CM Carnival Multi Colour Sparklers","Box",610],["30CM Electric Sparklers (10 Pcs)","Box",240],["30CM Colour Sparklers (10 Pcs)","Box",260],["30CM Multi Colour Sparklers (10 Pcs)","Box",280],["50CM Electric Sparklers (5 Pcs)","Tube",360],["50CM Colour Sparklers (5 Pcs)","Tube",390],["Spinner Rotating Sparklers","Tube",230]]],
["SINGLE SOUND CRACKERS",[["3½\" Sri Lakshmi Special Crackers","5 Pkt",190],["4\" Sri Lakshmi Special Crackers","5 Pkt",270],["4\" Sri MahaLakshmi Super Crackers","5 Pkt",375],["2¾ Kuruvi Crackers","10 Pkt",225],["4\" Two Sound Crackers","Pkt",90],["4\" Two Sound Colour Crackers","Pkt",100]]],
["ATOM BOMBS",[["Atom Bomb","Box",100],["Hydro Bomb","Box",180],["Canan Bomb","Box",280],["Xeena Bomb","Box",400],["Bullet Bomb","Box",90],["Paper Bomb (3 Pcs)","Box",360],["Hyper Bomb (3 Pcs)","Box",300]]],
["BIJILI CRACKERS",[["Red Bijili Crackers","Pkt",90],["Stripped Bijili Crackers","Pkt",100]]],
["SPECIAL CRACKERS MAGIC",[["28 Magic Crackers","Pkt",60],["56 Magic Crackers","Pkt",100],["100 Strip Magic Crackers","Pce",120],["1000 Strip Magic Crackers","Pce",900],["2000 Strip Magic Crackers","Pce",1600],["Eco 1000 Strip Magic Crackers - VKP","Pce",540],["Eco 2000 Strip Magic Crackers - VKP","Pce",1050],["Eco 5000 Strip Magic Crackers - VKP","Pce",2700]]],
["GROUND CHAKKARS",[["Ground Chakkar Big (10Pcs)","Box",100],["Ground Chakkar Special","Box",210],["Ground Chakkar Deluxe","Box",360],["Giant Wheel (5 Pcs)","Box",290],["Whistling Wheel (5 Pcs)","Box",300],["Lotus Wheel (5 Pcs)","Box",240]]],
["FLOWER POTS",[["Flower pots Medium","Box",120],["Flower Pots Big","Box",190],["Flower Pots Special","Box",300],["Flower Pots Gaint","Box",430],["Holi Giant (6Pcs)","Box",300],["Pearl Deluxe (5Pcs)","Box",390],["Wonder Pots (10pcs)","Box",520],["Moti Mahal Deluxe (10Pcs)","Box",600],["Maha Utsav Super (5 pcs)","Box",550]]],
["SHOWERS",[["Green Showers (5 Pcs)","Box",200],["Silver Showers (5 Pcs)","Box",260],["Golden Showers (5 Pcs)","Box",200],["Happy Shower (10 pcs)","Box",360],["Gold Hunter (3 Pcs)","Box",200],["Crackling Koti (3 Pcs)","Box",200],["Tiffany (3 Pcs)","Box",200],["Ashrafi (3 Pcs)","Box",200],["Gold Bouquet (3 Pcs)","Box",200],["Pogo Silver","Pcs",120],["Pogo Red","Pcs",120],["Pogo Multi Colour","Pcs",120],["Let's party","Pcs",150],["Let's party Multi Colour","Pcs",150],["Let's Party Crackling","Pcs",150]]],
["NOVELTY FIREWORKS",[["18\" Special Twinkling Star","Box",90],["48\" Super Twinkling Star","Box",210],["Pencil Small (Box)","Box",90],["Pencil Big","Box",180],["Mega Torch (5 Pcs)","Box",170],["Chenda Melam (2 Pcs)","Box",400],["Emerald Stones","Box",70],["Assorted Cartoon","Box",70],["Snake Cartoon","Box",100]]],
["SPACE ROCKETS",[["Rocket Bomb","Box",180],["Lunik Rocket","Box",380],["Two Sound Rocket","Box",400],["Air Whistle","Box",400]]],
["NEW ATTRACTIONS",[["Lilly Phut (Crackling)","Box",70],["Dancing Butterfly (5 Pcs)","Box",90],["Pamparam (5 Pcs)","Box",110],["Kuckoo Dance","Box",430],["Drone Sky Rider (5 Pcs)","Box",200],["Helicopter (5 Pcs)","Box",190],["Photo Flash (5 Pcs)","Box",120],["Mini Siren (5 Pcs)","Box",250]]],
["MINI COMETS",[["Sky Fyte (2 Pcs)","Box",90],["Chotta bheem (Aerial 5 pcs)","Box",180],["Wonder 5 (Mini Comet - 5 pcs)","Box",300]]],
["1¼\" COMETS",[["Green Dreams (3 Pcs)","Box",300],["Red Dreams (3 Pcs)","Box",300],["Gold Dreams (3 Pcs)","Box",300],["Silver Dreams (3 Pcs)","Box",300]]],
["2\" COMETS",[["Green Angel","Pce",300],["Red Angel","Pce",300],["Night Angel","Pce",300],["Golden Angel","Pce",300],["Flash Queen","Pce",300],["Green Dreams (2 Pcs)","Box",490],["Red Dreams (2 Pcs)","Box",490],["Night Dreams (2 Pcs)","Box",490]]],
["3\" COMETS",[["Gold Heaven","Pce",600],["Fantasy","Pce",600],["Glamour","Pce",600],["Google","Pce",600],["Fantasy (2 PCS)","Box",1100],["Glamour (2 Pcs)","Box",1100],["Google (2 PCS)","Box",1100]]],
["SPECIAL COMETS",[["3\" Special Comet (6 Varieties)","Box",720]]],
["REPEATING CAKES",[["12 Star Rider","Box",250],["12 Croma Multi colour","Box",350],["16 Shots Feast","Box",490],["30 Shot Fun","Box",880],["30 Shot Enjoy","Box",780],["30 Shot Gold","Box",690],["60 Shot Rush","Box",1700],["Mumbai Night 60 Shots","Box",1600],["120 Shot Colour Garden","Box",3600],["Festival Night 120 Shot","Box",3100],["240 Shot Spark","Box",6900]]],
["AMORCES & MATCHES",[["Star matches","Box",100],["Pops Colour matches","Box",150],["Josh matches","Box",200],["Rainbow Super matches","Box",300],["Snake Tablets Deluxe","Box",90],["Roll Cap","Box",140]]],
["GIFT BOX",[["Gift Box Rainbow (11 Items)","Box",370],["Gift box Subam (16 Items)","Box",600],["Gift box Diwali (24 Items)","Box",900],["Gift box Festival (30 Items)","Box",1300],["Gift box Celebration (36 Items)","Box",1800],["Gift box Grand (50 Items)","Box",2700]]]];
const $=s=>document.getElementById(s),inr=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN");
const items=[];let sn=0;D.forEach(([c,a])=>a.forEach(([n,p,r])=>items.push({id:++sn,c,n,p,r,q:0})));
const cf=$("cf");cf.innerHTML='<option value="">All categories</option>'+D.map(d=>`<option>${d[0].replace(/"/g,"&quot;")}</option>`).join("");
let last="";const L=$("list");
items.forEach(it=>{if(it.c!==last){last=it.c;const h=document.createElement("div");h.className="cat";h.textContent=it.c;h.dataset.c=it.c;L.appendChild(h)}
const d=document.createElement("div");d.className="row";d.dataset.c=it.c;d.dataset.s=(it.n+" "+it.c).toLowerCase();it.el=d;
d.innerHTML=`<span class="n">${it.id}</span><span>${it.n}</span><span class="per">per ${it.p}</span><input class="r${it.r?"":" z"}" type="number" min="0" value="${it.r||""}" placeholder="rate" aria-label="Rate"><div class="qty"><button>−</button><input type="number" min="0" value="0" aria-label="Qty"><button>+</button></div>`;
const [rt,qi]=[d.querySelector(".r"),d.querySelector(".qty input")],[mn,pl]=d.querySelectorAll(".qty button");
const set=v=>{it.q=Math.max(0,parseInt(v)||0);qi.value=it.q;d.classList.toggle("on",it.q>0);bill()};
mn.onclick=()=>set(it.q-1);pl.onclick=()=>set(it.q+1);qi.onchange=()=>set(qi.value);qi.onfocus=()=>qi.select();
rt.oninput=()=>{it.r=parseFloat(rt.value)||0;rt.classList.toggle("z",!it.r);bill()};L.appendChild(d)});
function filt(){const t=$("q").value.trim().toLowerCase(),c=cf.value,vis={};
items.forEach(i=>{const ok=(!c||i.c===c)&&(!t||i.el.dataset.s.includes(t));i.el.style.display=ok?"":"none";if(ok)vis[i.c]=1});
L.querySelectorAll(".cat").forEach(h=>h.style.display=vis[h.dataset.c]?"":"none")}
$("q").oninput=filt;cf.onchange=filt;
function calc(){const ls=items.filter(i=>i.q>0),st=ls.reduce((s,i)=>s+i.q*i.r,0),dp=Math.min(100,Math.max(0,parseFloat($("dp").value)||0)),da=st*dp/100;return{ls,st,dp,da,gt:st-da}}
function bill(){const b=calc();$("bl").innerHTML=b.ls.length?b.ls.map(i=>`<div class="bl"><span>${i.n}<br><small style="color:var(--mu)">${i.q} × ${inr(i.r)}</small></span><b>${inr(i.q*i.r)}</b></div>`).join(""):'<div class="empty">No items selected</div>';
$("st").textContent=inr(b.st);$("da").textContent="-"+inr(b.da);$("gt").textContent=inr(b.gt)}
$("dp").oninput=bill;
$("clr").onclick=()=>{if(!confirm("Clear the bill?"))return;items.forEach(i=>{i.q=0;i.el.classList.remove("on");i.el.querySelector(".qty input").value=0});$("cn").value=$("cp").value="";bill()};
function no(){let n=1;try{n=(parseInt(localStorage.getItem("essakiBill"))||0)+1;localStorage.setItem("essakiBill",n)}catch(e){n=Date.now()%100000}return n}
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
$("pr").onclick=()=>{const b=calc();if(!b.ls.length){alert("Select at least one item.");return}
const z=b.ls.filter(i=>!i.r);if(z.length&&!confirm("Some items have no rate: "+z.map(i=>i.n).join(", ")+". Print anyway?"))return;
const now=new Date(),cn=$("cn").value.trim(),cp=$("cp").value.trim();
$("rc").innerHTML=`<div class="c b" style="font-size:15px">ESSAKI TRADING COMPANY</div><div class="c">Crackers · Price List 2026</div><div class="c">Ph: 99441 67169 / 93441 18016</div><hr>
<div class="l"><span>Bill #${no()}</span><span>${now.toLocaleDateString("en-IN")} ${now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</span></div>${cn?`<div>Name: ${esc(cn)}</div>`:""}${cp?`<div>Phone: ${esc(cp)}</div>`:""}<hr>
${b.ls.map((i,k)=>`<div>${k+1}. ${esc(i.n)}</div><div class="l"><span>&nbsp;&nbsp;${i.q} x ${i.r}</span><span>${(i.q*i.r).toFixed(2)}</span></div>`).join("")}<hr>
<div class="l"><span>Items: ${b.ls.length} | Qty: ${b.ls.reduce((s,i)=>s+i.q,0)}</span></div>
<div class="l"><span>Subtotal</span><span>${b.st.toFixed(2)}</span></div>${b.da?`<div class="l"><span>Discount (${b.dp}%)</span><span>-${b.da.toFixed(2)}</span></div>`:""}
<div class="l b" style="font-size:15px"><span>TOTAL</span><span>Rs.${b.gt.toFixed(2)}</span></div><hr>
<div class="c">Goods supplied as per estimate only</div><div class="c b">Thank you! Visit again 🎇</div><br>`;
setTimeout(()=>window.print(),50)};
bill();
</script></body></html>
